name: DB backup

# Hằng ngày 02:00 giờ VN. `schedule` chỉ chạy trên nhánh mặc định (master).
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres trống để nạp thử bản vừa dump: backup chưa restore được thì
    # coi như chưa có backup.
    services:
      restore-test:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: restore-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Khác deploy: thiếu secret thì đánh trượt, không lặng lẽ bỏ qua.
          [ -n "$BACKUP_DATABASE_URL" ] || { echo "::error::Chưa đặt secret BACKUP_DATABASE_URL"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Chưa đặt secret BACKUP_PASSPHRASE"; exit 1; }

      # Client phải cùng major với server (Supabase đang chạy Postgres 17);
      # apt mặc định của Ubuntu chỉ có bản cũ hơn.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: sh scripts/db/backup.sh backups

      - name: Restore test
        env:
          RESTORE_DATABASE_URL: postgresql://postgres:restore-test@localhost:5432/postgres
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: sh scripts/db/restore.sh backups/*.dump.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
